<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Iron Glove — Homewood flythrough</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #071018; font-family: ui-sans-serif, system-ui; }
    #hud {
      position: fixed; left: 16px; top: 16px; color: #d7f6ff;
      text-shadow: 0 2px 8px #000; pointer-events: none; z-index: 2;
    }
    #hud b { color: #7ee0ff; }
    #bar {
      position: fixed; left: 16px; right: 16px; bottom: 16px;
      display: flex; gap: 8px; z-index: 2; flex-wrap: wrap; align-items: center;
    }
    button {
      background: #123; color: #d7f6ff; border: 1px solid #3af;
      padding: 8px 12px; border-radius: 8px; cursor: pointer;
    }
    #boss { color: #ff8b8b; }
    #stdbStatus { color: #9ad; font-size: 13px; }
  </style>
</head>
<body>
  <div id="hud">
    <div><b>IRON GLOVE</b> — Homewood campus</div>
    <div>alt <span id="alt">0</span> m · spd <span id="spd">0</span></div>
    <div>pitch <span id="pit">0</span> · roll <span id="rol">0</span> · <span id="mode">keyboard</span></div>
    <div id="boss">boss HP <span id="hp">100</span></div>
    <div style="opacity:.7;margin-top:8px">
      Keys: W thrust · S brake · Space climb · C descend · mouse look · F shoot<br>
      Glove: palm down climb · palm back thrust · palm forward brake
    </div>
  </div>
  <div id="bar">
    <button id="connect">Connect glove (Web Serial)</button>
    <button id="cal">Calibrate level</button>
    <button id="online">Go online (SpaceTimeDB)</button>
    <span id="stdbStatus">offline (local boss)</span>
  </div>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { createIronGloveStdb } from "./stdb-bridge.js";

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x87b8d8, 80, 420);
    scene.background = new THREE.Color(0x87b8d8);

    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xcfe9ff, 0x334422, 1.1));
    const sun = new THREE.DirectionalLight(0xfff2d0, 1.2);
    sun.position.set(40, 80, 20);
    scene.add(sun);

    // Stylized Homewood blockout. Swap the ground texture for a campus satellite crop.
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(800, 800),
      new THREE.MeshLambertMaterial({ color: 0x3d6b3a })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    const roadMat = new THREE.MeshLambertMaterial({ color: 0x4a4a4a });
    function road(x, z, w, l, rot = 0) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.4, l), roadMat);
      m.position.set(x, 0.2, z);
      m.rotation.y = rot;
      scene.add(m);
    }
    road(0, 0, 18, 400);
    road(0, 0, 400, 18);
    road(80, -40, 14, 220, 0.2);

    const bldgMat = new THREE.MeshLambertMaterial({ color: 0xc9d0d8 });
    const brick = new THREE.MeshLambertMaterial({ color: 0x8a5a44 });
    function hall(x, z, w, h, d, mat = bldgMat) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      m.position.set(x, h / 2, z);
      scene.add(m);
    }
    hall(-30, -20, 40, 18, 28, brick);   // stand-in Hodson
    hall(50, -70, 55, 22, 32, brick);    // stand-in Gilman
    hall(-90, 40, 30, 14, 50);           // dorm slab
    hall(20, 90, 70, 10, 24);            // long lab
    hall(120, 10, 26, 28, 26, brick);

    const trees = new THREE.MeshLambertMaterial({ color: 0x1f5a28 });
    for (let i = 0; i < 40; i++) {
      const t = new THREE.Mesh(new THREE.ConeGeometry(3, 10, 6), trees);
      t.position.set((Math.random() - 0.5) * 300, 5, (Math.random() - 0.5) * 300);
      scene.add(t);
    }

    const suit = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.6, 1.2, 4, 8),
      new THREE.MeshStandardMaterial({ color: 0xb11212, metalness: 0.4, roughness: 0.35 })
    );
    suit.add(body);
    const glow = new THREE.Mesh(
      new THREE.SphereGeometry(0.25, 12, 12),
      new THREE.MeshBasicMaterial({ color: 0x7ee0ff })
    );
    glow.position.set(0, 0.2, 0.5);
    suit.add(glow);
    scene.add(suit);

    const boss = new THREE.Mesh(
      new THREE.OctahedronGeometry(3.2),
      new THREE.MeshStandardMaterial({ color: 0x222, emissive: 0x550000, metalness: 0.7 })
    );
    boss.position.set(40, 28, -60);
    boss.userData.hp = 100;
    scene.add(boss);

    const keys = {};
    addEventListener("keydown", (e) => (keys[e.code] = true));
    addEventListener("keyup", (e) => (keys[e.code] = false));

    const look = { x: 0, y: 0 };
    addEventListener("mousemove", (e) => {
      if (e.buttons === 1) {
        look.y -= e.movementX * 0.005;
        look.x -= e.movementY * 0.005;
        look.x = Math.max(-1.1, Math.min(0.35, look.x));
      }
    });

    const state = {
      pos: new THREE.Vector3(0, 8, 30),
      vel: new THREE.Vector3(),
      hp: 100,
      pitch: 0,
      roll: 0,
      p0: 0,
      r0: 0,
      serial: false,
      online: false,
      poseAcc: 0,
    };

    // SpaceTimeDB: shared boss HP + other pilots. Offline demo still works without it.
    const remotePilots = new Map();
    const stdb = createIronGloveStdb({
      host: "wss://maincloud.spacetimedb.com",
      dbName: "iron-glove-suyog",
    });
    stdb.onStatus((msg) => {
      document.getElementById("stdbStatus").textContent = msg;
      state.online = msg.startsWith("joined") || msg === "online";
    });
    stdb.onBossHp((hp) => {
      boss.userData.hp = hp;
      if (hp <= 0) {
        boss.material.emissive.setHex(0x0a3);
        document.getElementById("hp").textContent = "DOWN";
      } else {
        document.getElementById("hp").textContent = String(hp);
      }
    });
    stdb.onPilots((list) => {
      const mine = stdb.identityHex;
      const seen = new Set();
      for (const p of list) {
        if (mine && p.id === mine) continue;
        seen.add(p.id);
        let mesh = remotePilots.get(p.id);
        if (!mesh) {
          mesh = new THREE.Mesh(
            new THREE.CapsuleGeometry(0.5, 1.0, 4, 8),
            new THREE.MeshStandardMaterial({ color: 0x2a6fff, metalness: 0.3, roughness: 0.4 })
          );
          scene.add(mesh);
          remotePilots.set(p.id, mesh);
        }
        mesh.position.set(p.x, p.y, p.z);
        mesh.rotation.y = p.yaw;
        mesh.visible = p.alive;
      }
      for (const [id, mesh] of remotePilots) {
        if (!seen.has(id)) {
          scene.remove(mesh);
          remotePilots.delete(id);
        }
      }
    });

    function controlFromGlove() {
      const p = state.pitch - state.p0;
      const r = state.roll - state.r0;
      let up = 0, thrust = 0, brake = 0;
      if (p < -18) up = Math.min(1, (-p - 18) / 25);
      if (p > 18) brake = Math.min(1, (p - 18) / 25);
      if (r > 16) thrust = Math.min(1, (r - 16) / 25);
      if (r < -16) brake = Math.max(brake, Math.min(1, (-r - 16) / 25));
      return { up, thrust, brake };
    }

    function controlFromKeys() {
      return {
        up: keys.Space ? 1 : keys.KeyC ? -0.6 : 0,
        thrust: keys.KeyW ? 1 : 0,
        brake: keys.KeyS ? 1 : 0,
      };
    }

    const shots = [];
    addEventListener("keydown", (e) => {
      if (e.code === "KeyF") fire();
    });
    function fire() {
      const dir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), look.y);
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.2, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0x7ee0ff })
      );
      mesh.position.copy(state.pos);
      mesh.userData.dir = dir;
      scene.add(mesh);
      shots.push(mesh);
    }

    function tick(dt) {
      const c = state.serial ? controlFromGlove() : controlFromKeys();
      const yaw = look.y;
      const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
      state.vel.addScaledVector(forward, c.thrust * 28 * dt);
      state.vel.multiplyScalar(1 - c.brake * 1.8 * dt);
      state.vel.y += (c.up * 22 - 8) * dt;
      state.vel.multiplyScalar(0.985);
      state.pos.addScaledVector(state.vel, dt);
      state.pos.y = Math.max(2, Math.min(80, state.pos.y));
      state.pos.x = Math.max(-380, Math.min(380, state.pos.x));
      state.pos.z = Math.max(-380, Math.min(380, state.pos.z));

      suit.position.copy(state.pos);
      camera.position.copy(state.pos).add(new THREE.Vector3(0, 2.2, 8).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw));
      camera.lookAt(state.pos.x, state.pos.y + 1, state.pos.z);

      boss.rotation.y += dt;
      boss.position.y = 26 + Math.sin(performance.now() / 600) * 3;
      const toBoss = boss.position.clone().sub(state.pos);
      if (toBoss.length() < 6) state.hp = Math.max(0, state.hp - 20 * dt);

      for (let i = shots.length - 1; i >= 0; i--) {
        shots[i].position.addScaledVector(shots[i].userData.dir, 60 * dt);
        if (shots[i].position.distanceTo(boss.position) < 4) {
          if (state.online) {
            stdb.hitBoss(12);
          } else {
            boss.userData.hp = (boss.userData.hp ?? 100) - 12;
            if (boss.userData.hp <= 0) {
              boss.material.emissive.setHex(0x0a3);
              document.getElementById("hp").textContent = "DOWN";
            }
          }
          scene.remove(shots[i]);
          shots.splice(i, 1);
        }
      }
      if ((boss.userData.hp ?? 100) > 0) {
        document.getElementById("hp").textContent = Math.max(0, boss.userData.hp ?? 100).toFixed(0);
      }
      document.getElementById("alt").textContent = state.pos.y.toFixed(1);
      document.getElementById("spd").textContent = state.vel.length().toFixed(1);
      document.getElementById("pit").textContent = state.pitch.toFixed(0);
      document.getElementById("rol").textContent = state.roll.toFixed(0);
      document.getElementById("mode").textContent = state.serial ? "glove" : "keyboard";

      // Push pose ~10 Hz when online
      if (state.online) {
        state.poseAcc += dt;
        if (state.poseAcc >= 0.1) {
          state.poseAcc = 0;
          stdb.updatePose(state.pos.x, state.pos.y, state.pos.z, yaw, c.thrust > 0);
        }
      }
    }

    let last = performance.now();
    function loop(now) {
      tick((now - last) / 1000);
      last = now;
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    document.getElementById("cal").onclick = () => {
      state.p0 = state.pitch;
      state.r0 = state.roll;
    };

    document.getElementById("online").onclick = () => {
      const name = prompt("Pilot name", "Pilot") || "Pilot";
      stdb.connect(name);
    };

    document.getElementById("connect").onclick = async () => {
      if (!navigator.serial) {
        alert("Use Chrome. Web Serial is required.");
        return;
      }
      const port = await navigator.serial.requestPort();
      await port.open({ baudRate: 115200 });
      const reader = port.readable.pipeThrough(new TextDecoderStream()).getReader();
      state.serial = true;
      let buf = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += value;
        const lines = buf.split("\n");
        buf = lines.pop();
        const line = lines.pop();
        if (!line) continue;
        const p = line.trim().split(",").map(Number);
        if (p.length >= 2 && Number.isFinite(p[0])) {
          state.pitch = p[0];
          state.roll = p[1];
        }
      }
    };
  </script>
</body>
</html>
