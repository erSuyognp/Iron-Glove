<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IRON GLOVE — Homewood</title>
  <link rel="stylesheet" href="/src/hud/hud.css" />
</head>
<body>
  <!-- CesiumJS renders here -->
  <div id="cesiumContainer"></div>

  <!-- Speed effects: edge motion blur + vignette, intensity driven by velocity -->
  <div id="speed-blur"></div>
  <div id="speed-vignette"></div>

  <!-- Boot / error banner -->
  <div id="boot-banner" class="boot-banner hidden"></div>

  <!-- ================= HUD OVERLAY ================= -->
  <div id="hud" class="hud">
    <!-- Top bar -->
    <div class="hud-top">
      <div class="hud-title">
        <span class="hud-title-main">IRON GLOVE</span>
        <span class="hud-title-sub">HOMEWOOD</span>
      </div>
      <div class="hud-suit">
        <span class="hud-suit-label">SUIT</span>
        <span id="hud-suit-hp" class="hud-suit-hp">100</span>
        <div class="hud-bar"><div id="hud-suit-bar" class="hud-bar-fill"></div></div>
      </div>
    </div>

    <!-- Left telemetry stack -->
    <div class="hud-left">
      <div class="stat"><span class="stat-k">ALT</span><span id="hud-alt" class="stat-v">0.0</span><span class="stat-u">m</span></div>
      <div class="stat"><span class="stat-k">SPD</span><span id="hud-spd" class="stat-v">0.0</span><span class="stat-u">m/s</span></div>
      <div class="stat"><span class="stat-k">PITCH</span><span id="hud-pitch" class="stat-v">0</span><span class="stat-u">°</span></div>
      <div class="stat"><span class="stat-k">ROLL</span><span id="hud-roll" class="stat-v">0</span><span class="stat-u">°</span></div>
      <div class="stat"><span class="stat-k">HDG</span><span id="hud-hdg" class="stat-v">0</span><span class="stat-u">°</span></div>
      <div class="stat mode"><span class="stat-k">MODE</span><span id="hud-mode" class="stat-v">KEYBOARD</span></div>
      <div class="stat mode"><span class="stat-k">LINK</span><span id="hud-net" class="stat-v">…</span></div>
      <div class="hud-actions">
        <button type="button" id="btn-connect-glove" class="hud-btn">CONNECT GLOVE</button>
      </div>
    </div>

    <!-- Heading tape (scrolls with heading) -->
    <div id="heading-tape" class="heading-tape"></div>

    <!-- Center artificial horizon / pitch ladder / bank indicator -->
    <div id="attitude" class="attitude"></div>

    <!-- Ground proximity warning -->
    <div id="gpws" class="gpws">PULL UP</div>

    <!-- Repulsor blast flash (fist gesture) -->
    <div id="repulsor-flash"></div>

    <!-- JARVIS ticker (wired for Phase 4, static for now) -->
    <div class="hud-jarvis">
      <span class="jarvis-label">JARVIS</span>
      <span id="jarvis-ticker" class="jarvis-line">Suit online. Homewood airspace is clear, sir.</span>
    </div>

    <!-- Bottom help bar -->
    <div id="hud-help" class="hud-help">
      <span class="key">W</span> thrust
      <span class="key">S</span> brake
      <span class="key">A</span>/<span class="key">D</span> yaw
      <span class="key">↑</span>/<span class="key">↓</span> climb / dive
      <span class="key">Q</span>/<span class="key">E</span> roll
      <span class="key">Space</span> boost
      <span class="key">R</span> reset
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
